      }

      .nav,

        margin: 0 auto;
      }

      .nav {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--navy);
        font-weight: 900;
        text-decoration: none;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border: 3px solid var(--blue);
        border-radius: 50%;
        background:

          linear-gradient(180deg, #fff 0 48%, var(--red) 49% 58%, #fff 59% 100%);

      .nav-links {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        flex-wrap: wrap;
      }

      .nav-links a {

        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .nav-links a:hover {
        color: var(--blue);
        background: rgba(8, 119, 201, 0.1);
      }

      main {
        padding: 58px 0 72px;
      }

        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        gap: 28px;
        align-items: start;
      }

      .detail-panel,
      .related-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .poster-panel {
        overflow: hidden;
      }

      .poster-panel img {
        width: 100%;
        min-height: 520px;
        display: block;
        object-fit: cover;
      }

        min-height: 520px;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--muted);
        background: #fff;
        text-align: center;
      }

        display: block;
        color: var(--navy);
        font-size: 1.3rem;
        line-height: 1.4;
      }

      .poster-fallback span {
        display: block;
        margin-top: 8px;
        line-height: 1.7;
      }

      .detail-panel {
        padding: 30px;
      }

      .eyebrow {
        width: fit-content;
        padding: 7px 11px;
        border: 1px solid rgba(8, 119, 201, 0.25);
        border-radius: 999px;
        color: var(--blue);
        background: rgba(255, 255, 255, 0.82);
        font-size: 0.82rem;
        font-weight: 900;
      }

        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.08;
        word-break: keep-all;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }

      .lead {
        margin-top: 18px;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.86;
      }

      .meta {
        margin-top: 22px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

        padding: 5px 9px;

        background: rgba(8, 119, 201, 0.1);
        color: #0865a9;
        font-size: 0.78rem;

        color: #b33131;
      }

      .tag.green {
        background: rgba(36, 148, 109, 0.12);
        color: #1e7457;
      }

      .info-grid {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .info-item {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .info-item span {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .info-item strong {
        display: block;
        margin-top: 5px;
        color: var(--navy);
        line-height: 1.45;
      }

      .section-block {
        margin-top: 28px;
      }

      .section-block h2 {
        color: var(--navy);
        font-size: 1.2rem;
      }

        margin-top: 12px;

      .point-list {

        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

        color: white;
        font-weight: 900;
        text-decoration: none;

          grid-template-columns: 1fr;

      const selected = movieMap.get(params.get("id")) || movies[0];

      document.title = `${selected.title} | 映画ドラえもんポートフォリオ`;
      document.getElementById("movie-year").textContent = `${selected.year} / 作品詳細`;

      document.getElementById("info-stage").textContent = selected.stage;
      document.getElementById("info-entry").textContent = selected.entry;
      document.getElementById("official-link").href = selected.official;

      const posterPanel = document.getElementById("poster-panel");
      if (selected.image) {
        const image = document.createElement("img");
        image.src = selected.image;
        image.alt = selected.alt;
        image.loading = "lazy";
        posterPanel.append(image);
      } else {
        const fallback = document.createElement("div");
        fallback.className = "poster-fallback";
        fallback.innerHTML = "<strong>公式画像なし</strong><span>この年は新作劇場公開なしの整理メモです。</span>";
        posterPanel.append(fallback);
      }

      const tags = document.getElementById("movie-tags");
      selected.tags.forEach((tag, index) => {
        const item = document.createElement("span");
        item.className = index === 1 ? "tag red" : index === 2 ? "tag green" : "tag";
        item.textContent = tag;
        tags.append(item);
      });

      const points = document.getElementById("movie-points");
      selected.points.forEach((point) => {
        const item = document.createElement("li");
        item.textContent = point;
        points.append(item);
      });

      const related = document.getElementById("related-grid");
      [movies[selectedIndex - 1], movies[selectedIndex + 1]].filter(Boolean).forEach((movie) => {
        const card = document.createElement("a");
        card.className = "related-card";
        card.href = `movie.html?id=${movie.id}`;
        card.innerHTML = `<span>${movie.year}</span><strong>${movie.title}</strong>`;
